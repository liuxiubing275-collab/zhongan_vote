<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>投票后台</title>

    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body{

            margin:0;
            padding:20px;

            font-family:"Microsoft YaHei";

            background:#f4f6fb;
        }

        #loginBox{

            width:400px;

            margin:120px auto;

            background:#fff;

            padding:40px;

            border-radius:16px;

            box-shadow:0 4px 16px rgba(0,0,0,0.1);

            text-align:center;
        }

        #loginBox h1{

            margin-bottom:30px;

            color:#2563eb;
        }

        #adminPassword{

            width:100%;

            height:50px;

            font-size:20px;

            border:1px solid #ccc;

            border-radius:10px;

            padding:0 15px;
        }

        .login-btn{

            width:100%;

            height:50px;

            margin-top:20px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:#fff;

            font-size:20px;

            cursor:pointer;
        }

        #adminPanel{

            display:none;
        }

    </style>

</head>

<body>

    <!-- 登录 -->

    <div id="loginBox">

        <h1>后台登录</h1>

        <input
            type="password"
            id="adminPassword"
            placeholder="请输入密码"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            登录
        </button>

    </div>

    <!-- 后台 -->

    <div id="adminPanel">

        <h1>后台管理系统</h1>

        <button onclick="refreshResults()">
            刷新
        </button>

        <button onclick="resetVotes()">
            复位投票
        </button>

        <div id="resultsContainer"></div>

    </div>

    <!-- VERY IMPORTANT -->
    <!-- admin.js 放最后 -->

    <script src="admin.js?v=20260520"></script>

</body>

</html>
