<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>中干竞聘投票后台</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js?v=20260520"></script>

    <style>

        *{
            box-sizing:border-box;
        }

        body{

            margin:0;
            padding:0;

            font-family:"Microsoft YaHei";

            background:#f4f6fb;

            overflow:hidden;
        }

        /* 登录 */

        #loginBox{

            width:420px;

            background:#fff;

            padding:40px;

            border-radius:18px;

            box-shadow:0 4px 20px rgba(0,0,0,0.15);

            position:absolute;

            top:50%;

            left:50%;

            transform:translate(-50%,-50%);

            text-align:center;
        }

        #loginBox h1{

            margin-bottom:30px;

            color:#2563eb;
        }

        #adminPassword{

            width:100%;

            height:52px;

            border:1px solid #ccc;

            border-radius:10px;

            padding:0 15px;

            font-size:18px;
        }

        .login-btn{

            width:100%;

            height:52px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:#fff;

            font-size:20px;

            margin-top:20px;

            cursor:pointer;
        }

        .login-btn:hover{

            background:#1d4ed8;
        }

        /* 后台 */

        #adminPanel{

            display:none;

            width:100vw;

            height:100vh;

            padding:12px;

            overflow:hidden;
        }

        .top-bar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:12px;
        }

        .stats{

            display:flex;

            gap:20px;

            font-size:22px;

            font-weight:bold;

            color:#1e3a8a;
        }

        .toolbar{

            display:flex;

            gap:12px;
        }

        .toolbar button{

            border:none;

            border-radius:10px;

            padding:12px 20px;

            font-size:18px;

            cursor:pointer;

            color:#fff;
        }

        .refresh-btn{

            background:#2563eb;
        }

        .reset-btn{

            background:#dc2626;
        }

        .fullscreen-btn{

            background:#16a34a;
        }

        .toolbar button:hover{

            opacity:0.9;
        }

        /* 岗位布局 */

        #resultsContainer{

            display:grid;

            grid-template-columns:repeat(5, 1fr);

            grid-template-rows:repeat(3, 1fr);

            gap:12px;

            height:calc(100vh - 110px);
        }

        .position-section{

            background:#fff;

            border-radius:16px;

            padding:12px;

            box-shadow:0 2px 8px rgba(0,0,0,0.08);

            display:flex;

            flex-direction:column;

            overflow:hidden;
        }

        .position-title{

            text-align:center;

            font-size:24px;

            font-weight:bold;

            color:#2563eb;

            margin-bottom:10px;

            border-bottom:2px solid #dbeafe;

            padding-bottom:8px;
        }

        .candidate-list{

            display:flex;

            flex-direction:column;

            gap:10px;

            flex:1;
        }

        .candidate-card{

            flex:1;

            border-radius:12px;

            background:#f8fafc;

            padding:10px;

            display:flex;

            flex-direction:column;

            justify-content:center;

            align-items:center;

            border:2px solid #e5e7eb;
        }

        .candidate-name{

            font-size:28px;

            font-weight:bold;

            color:#111827;
        }

        .candidate-votes{

            font-size:24px;

            margin-top:6px;

            color:#2563eb;
        }

        .candidate-rate{

            font-size:26px;

            font-weight:bold;

            margin-top:6px;
        }

    </style>

</head>

<body>

    <!-- 登录 -->

    <div id="loginBox">

        <h1>后台管理登录</h1>

        <input
            type="password"
            id="adminPassword"
            placeholder="请输入后台密码"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            登录
        </button>

    </div>

    <!-- 后台 -->

    <div id="adminPanel">

        <div class="top-bar">

            <div class="stats">

                <div>
                    已投票：
                    <span id="votedUsers">0</span>
                </div>

                <div>
                    总人数：
                    <input
                        id="totalPeople"
                        type="number"
                        value="70"
                        style="
                            width:80px;
                            height:36px;
                            font-size:20px;
                        "
                    >
                </div>

                <div>
                    参与率：
                    <span id="joinRate">0%</span>
                </div>

            </div>

            <div class="toolbar">

                <button
                    class="refresh-btn"
                    onclick="refreshResults()"
                >
                    刷新
                </button>

                <button
                    class="reset-btn"
                    onclick="resetVotes()"
                >
                    复位投票
                </button>

                <button
                    class="fullscreen-btn"
                    onclick="document.documentElement.requestFullscreen()"
                >
                    全屏
                </button>

            </div>

        </div>

        <div id="resultsContainer"></div>

    </div>

</body>

</html>
